<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="25%" stop-color="#FDF0CD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#DFBA4E" />
    </linearGradient>
    
    <linearGradient id="goldHGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DA88" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#936800" />
    </linearGradient>

    <linearGradient id="whitePageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F1F3F5" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <linearGradient id="goldWingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996D09" />
      <stop offset="50%" stop-color="#E7C665" />
      <stop offset="100%" stop-color="#AA7A10" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="600" height="600" fill="#0A0B0D" rx="28" />

  <!-- The Monogram: Serif Golden 'H' -->
  <g transform="translate(0, -10)" filter="url(#subtleGlow)">
    <!-- Left Stems & Serifs of H -->
    <path d="
      M 175 110 L 255 110 L 255 125 L 235 128 L 235 320 L 255 323 L 255 338 L 175 338 L 175 323 L 195 320 L 195 128 L 175 125 Z
    " fill="url(#goldHGrad)" />

    <!-- Right Stems & Serifs of H -->
    <path d="
      M 345 110 L 425 110 L 425 125 L 405 128 L 405 320 L 425 323 L 425 338 L 345 338 L 345 323 L 365 320 L 365 128 L 345 125 Z
    " fill="url(#goldHGrad)" />

    <!-- Crossbar / Central Column support of H -->
    <path d="
      M 235 185 L 365 185 L 365 240 L 300 255 L 235 240 Z
    " fill="url(#goldHGrad)" opacity="0.95" />
  </g>

  <!-- Open Book Artwork Layered Over H -->
  <g transform="translate(0, 15)">
    <!-- Lower Gold Layer / Curved Pages (Left & Right Wings) -->
    <!-- Left lower gold wing -->
    <path d="
      M 300 295
      C 260 290 200 280 145 260
      C 175 278 230 298 300 325
      Z
    " fill="url(#goldGrad)" opacity="0.9" />
    
    <path d="
      M 300 305
      C 255 300 200 275 150 252
      C 185 278 240 305 300 332
      Z
    " fill="url(#goldWingGrad)" />

    <!-- Right lower gold wing -->
    <path d="
      M 300 295
      C 340 290 400 280 455 260
      C 425 278 370 298 300 325
      Z
    " fill="url(#goldGrad)" opacity="0.9" />

    <path d="
      M 300 305
      C 345 300 400 275 450 252
      C 415 278 360 305 300 332
      Z
    " fill="url(#goldWingGrad)" />

    <!-- Main Bold Upper Open Book Pages (White Wings) -->
    <!-- Left White Page -->
    <path d="
      M 300 285
      C 275 260 215 210 165 205
      C 180 230 235 265 295 295
      Z
    " fill="url(#whitePageGrad)" filter="url(#subtleGlow)" />
    
    <!-- Top left arched page curve -->
    <path d="
      M 300 280
      C 270 240 220 205 170 205
      C 220 215 265 245 298 282
      Z
    " fill="#FFFFFF" />

    <!-- Right White Page -->
    <path d="
      M 300 285
      C 325 260 385 210 435 205
      C 420 230 365 265 305 295
      Z
    " fill="url(#whitePageGrad)" filter="url(#subtleGlow)" />

    <!-- Top right arched page curve -->
    <path d="
      M 300 280
      C 330 240 380 205 430 205
      C 380 215 335 245 302 282
      Z
    " fill="#FFFFFF" />

    <!-- Book Spine / Center Crest Notch -->
    <path d="
      M 293 285
      Q 300 300 307 285
      L 303 335
      Q 300 338 297 335
      Z
    " fill="#AA7C11" />
  </g>

  <!-- Typography: HUSNAIN -->
  <text x="300" y="420" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Playfair Display', 'Cinzel', serif" 
        font-size="64" 
        font-weight="800" 
        letter-spacing="5">
    HUSNAIN
  </text>

  <!-- Flanking Gold Rules and 'EBOOKS' -->
  <g transform="translate(0, 465)">
    <!-- Left Horizontal Rule -->
    <line x1="90" y1="-8" x2="190" y2="-8" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- E B O O K S -->
    <text x="300" y="0" 
          text-anchor="middle" 
          fill="url(#goldGrad)" 
          font-family="'Cinzel', 'Playfair Display', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="11">
      EBOOKS
    </text>

    <!-- Right Horizontal Rule -->
    <line x1="410" y1="-8" x2="510" y2="-8" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tagline: READ • LEARN • GROW -->
  <g transform="translate(0, 520)">
    <text x="300" y="0" 
          text-anchor="middle" 
          fill="#F5DA88" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="5">
      READ  <tspan fill="url(#goldGrad)">•</tspan>  LEARN  <tspan fill="url(#goldGrad)">•</tspan>  GROW
    </text>
  </g>
</svg>
